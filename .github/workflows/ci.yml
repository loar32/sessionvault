name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: test
        run: go test ./...
      - name: govulncheck
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: zero network
        shell: bash
        run: |
          # В программе нет сетевых вызовов: среди зависимостей не должно быть HTTP и TLS.
          deps="$(go list -deps ./cmd/sessionvault)"
          if echo "$deps" | grep -E '^(net/http|crypto/tls|net/rpc|net/smtp)$'; then
            echo "найдена сетевая зависимость"; exit 1
          fi
          if grep -rEn '"(net/http|crypto/tls)"' --include=*.go cmd internal; then
            echo "найден сетевой импорт"; exit 1
          fi
      - name: build
        shell: pwsh
        run: ./tools/build.ps1
